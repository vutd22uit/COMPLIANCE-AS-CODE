# GitHub Actions Workflow - OpenStack Compliance Checks
# This workflow runs on every pull request to validate compliance

name: OpenStack Compliance Check

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'policies/**'
      - 'tests/**'
      - 'remediation/**'
      - '**.yml'
      - '**.yaml'
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  INSPEC_VERSION: '5.22'

jobs:
  # Job 1: Policy Validation
  policy-validation:
    name: OPA Policy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Validate Rego Syntax
        run: |
          echo "Validating OpenStack Rego policies..."
          opa check policies/rego/openstack/
          
      - name: Run OPA Tests
        run: |
          opa test policies/rego/openstack/ -v
        continue-on-error: true

      - name: Setup Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.45.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Test Sample Configurations
        run: |
          if [ -d "examples/openstack" ]; then
            conftest test examples/openstack/ \
              -p policies/rego/openstack/ \
              --output table \
              --all-namespaces
          else
            echo "No OpenStack examples to test"
          fi
        continue-on-error: true

  # Job 2: InSpec Profile Validation
  inspec-validation:
    name: InSpec Profile Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install InSpec
        run: |
          gem install inspec -v ${{ env.INSPEC_VERSION }}
          inspec --chef-license accept-silent

      - name: Validate OpenStack CIS Profile
        run: |
          echo "Validating OpenStack CIS InSpec profile..."
          inspec check tests/inspec/openstack-cis --chef-license accept-silent

      - name: Validate Linux CIS Profile
        run: |
          echo "Validating Linux CIS InSpec profile..."
          inspec check tests/inspec/linux-cis --chef-license accept-silent

      - name: List Controls
        run: |
          echo "=== OpenStack CIS Controls ==="
          inspec json tests/inspec/openstack-cis --chef-license accept-silent | jq '.controls[].id'
          
          echo "=== Linux CIS Controls ==="
          inspec json tests/inspec/linux-cis --chef-license accept-silent | jq '.controls[].id'

  # Job 3: Ansible Playbook Validation
  ansible-validation:
    name: Ansible Playbook Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible
        run: |
          pip install ansible ansible-lint yamllint

      - name: Lint YAML files
        run: |
          yamllint -f parsable remediation/ansible/

      - name: Lint Ansible Playbooks
        run: |
          ansible-lint remediation/ansible/ --format codeclimate
        continue-on-error: true

      - name: Validate Playbook Syntax
        run: |
          ansible-playbook remediation/ansible/cis-openstack-remediation.yml --syntax-check
          ansible-playbook remediation/ansible/cis-linux-remediation.yml --syntax-check

  # Job 4: Documentation Check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          test -f README.md || (echo "README.md missing!" && exit 1)

      - name: Check required docs
        run: |
          required_docs=(
            "docs/architecture.md"
            "docs/control-mapping.md"
            "docs/getting-started.md"
          )
          
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "Missing: $doc"
            else
              echo "Found: $doc"
            fi
          done

      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-config.json'
        continue-on-error: true

  # Job 5: Generate Compliance Report
  compliance-report:
    name: Generate Compliance Report
    runs-on: ubuntu-latest
    needs: [policy-validation, inspec-validation, ansible-validation]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate Summary Report
        run: |
          cat << 'EOF' > compliance-report.md
          # OpenStack CIS Compliance Report
          
          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Branch**: ${{ github.ref_name }}
          **Commit**: ${{ github.sha }}
          
          ## Validation Results
          
          | Check | Status |
          |-------|--------|
          | OPA Policy Validation | ${{ needs.policy-validation.result }} |
          | InSpec Profile Validation | ${{ needs.inspec-validation.result }} |
          | Ansible Playbook Validation | ${{ needs.ansible-validation.result }} |
          
          ## Coverage Summary
          
          ### OpenStack CIS Benchmark
          - **Identity (Keystone)**: 3/10 controls (30%)
          - **Compute (Nova)**: 4/12 controls (33%)
          - **Networking (Neutron)**: 4/8 controls (50%)
          - **Storage (Cinder/Swift)**: 4/6 controls (67%)
          
          ### Linux CIS Benchmark
          - **Total**: 18/95 controls (19%)
          
          ## Next Steps
          
          1. Review any failed validations
          2. Add missing controls
          3. Run full compliance scan against OpenStack environment
          EOF

      - name: Post Report as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('compliance-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: compliance-report.md

  # Job 6: Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [policy-validation, inspec-validation, ansible-validation]
    if: always()

    steps:
      - name: Check Quality Gate
        run: |
          echo "Quality gate check"
          
          if [ "${{ needs.policy-validation.result }}" != "success" ]; then
            echo "⚠️ OPA policy validation had issues"
          fi
          
          if [ "${{ needs.inspec-validation.result }}" != "success" ]; then
            echo "❌ InSpec profile validation failed"
            exit 1
          fi
          
          if [ "${{ needs.ansible-validation.result }}" != "success" ]; then
            echo "⚠️ Ansible playbook validation had issues"
          fi
          
          echo "✅ Quality gate passed"
