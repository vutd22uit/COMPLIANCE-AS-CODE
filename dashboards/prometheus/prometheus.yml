# Prometheus Configuration for OpenStack CIS Compliance Monitoring

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'openstack-compliance'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenStack Compliance Exporter
  - job_name: 'openstack-compliance'
    static_configs:
      - targets: ['compliance-exporter:9090']
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /metrics

  # Node Exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Additional OpenStack controller nodes (add your hosts)
  # - job_name: 'openstack-controllers'
  #   static_configs:
  #     - targets:
  #       - 'controller-01:9100'
  #       - 'controller-02:9100'
  #       - 'controller-03:9100'

