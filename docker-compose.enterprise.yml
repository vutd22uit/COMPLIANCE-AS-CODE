version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: compliance_postgres
    environment:
      POSTGRES_DB: compliance_db
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance_pass_change_me
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U compliance" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance_network

  # ============================================
  # Redis (Cache & Message Broker)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: compliance_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance_network

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compliance_backend
    environment:
      # Database
      DATABASE_URL: postgresql://compliance:compliance_pass_change_me@postgres:5432/compliance_db

      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # JWT
      JWT_SECRET_KEY: your-secret-key-change-in-production-use-openssl-rand-hex-32

      # API Settings
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WORKERS: 4
      LOG_LEVEL: info

    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./evidence_store:/app/evidence_store
      - ./scan-results:/app/scan-results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - compliance_network

  # ============================================
  # Celery Worker (Background Tasks)
  # ============================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compliance_celery_worker
    environment:
      DATABASE_URL: postgresql://compliance:compliance_pass_change_me@postgres:5432/compliance_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./evidence_store:/app/evidence_store
      - ./scan-results:/app/scan-results
    depends_on:
      - postgres
      - redis
    command: celery -A backend.workers.celery_app worker --loglevel=info
    networks:
      - compliance_network

  # ============================================
  # Celery Beat (Scheduler)
  # ============================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compliance_celery_beat
    environment:
      DATABASE_URL: postgresql://compliance:compliance_pass_change_me@postgres:5432/compliance_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    depends_on:
      - postgres
      - redis
    command: celery -A backend.workers.celery_app beat --loglevel=info
    networks:
      - compliance_network

  # ============================================
  # Prometheus (Metrics)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: compliance_prometheus
    volumes:
      - ./dashboards/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./dashboards/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    networks:
      - compliance_network

  # ============================================
  # Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: compliance_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=openstack-cis-2024
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - compliance_network
  # ============================================
  # Nginx (Reverse Proxy) - Optional for production
  # ============================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: compliance_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./frontend/dist:/usr/share/nginx/html
  #   depends_on:
  #     - backend
  #   networks:
  #     - compliance_network

  # ============================================
  # Networks
  # ============================================
networks:
  compliance_network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
